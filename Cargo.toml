[package]
name = "cornercase-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
core-foundation = "0.10.0"
core-video = "0.4.3"
futures = "0.3"
libc = "0.2"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
image = { version = "0.25.10", default-features = false }
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
objc2 = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
unicode-segmentation = "1.13.3"
parking_lot = "0.12"

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
