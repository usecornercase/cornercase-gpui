[package]
name = "cornercase-gpui"
version = "0.1.29"
edition = "2024"
description = "A native window for cornercase on macOS, Linux and Windows, drawn with GPUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/usecornercase/cornercase-gpui"
homepage = "https://github.com/usecornercase/cornercase-gpui"
readme = "README.md"
keywords = ["terminal", "gpui", "macos", "linux", "agents"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
futures = "0.3"
libc = "0.2, <0.2.190"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
unicode-segmentation = "1.13.3"
url = "2.5.8"
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.0"
core-video = "0.4.3"
objc2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.61.3", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
