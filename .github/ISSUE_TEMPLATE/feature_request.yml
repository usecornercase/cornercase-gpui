name: Feature request
description: An idea for cornercase-gpui
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you imagine it working, and where in the window. This app only draws what cornercase's command line exposes, so if it needs something cornercase does not offer yet, it may need an issue in cornercase-terminal first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how cornercase's own window or other tools do it.
