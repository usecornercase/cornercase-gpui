name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: clippy + tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: tests
        run: cargo test --locked

      - name: manual-check helper
        if: ${{ !cancelled() }}
        run: |
          swiftc -O -warnings-as-errors -o "$RUNNER_TEMP/manual-check" tools/manual-check.swift
          "$RUNNER_TEMP/manual-check" self-test

  linux:
    name: clippy + tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libfreetype-dev libfontconfig-dev libwayland-dev

      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: tests
        run: cargo test --locked

      - uses: taiki-e/install-action@v2
        if: ${{ !cancelled() }}
        with:
          tool: shellcheck@0.11.0

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck tools/*.sh

      - name: script tests (dash)
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for test in tools/*-test.sh; do
            SH=dash dash "$test" || failed=1
          done
          exit "$failed"

      - name: script tests (bash as sh)
        if: ${{ !cancelled() }}
        run: |
          ln -sf "$(command -v bash)" "$RUNNER_TEMP/sh"
          failed=0
          for test in tools/*-test.sh; do
            SH="$RUNNER_TEMP/sh" "$RUNNER_TEMP/sh" "$test" || failed=1
          done
          exit "$failed"

  windows:
    name: clippy + tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: tests
        run: cargo test --locked

  smoke-windows:
    name: smoke (Windows)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - name: cornercase
        run: powershell -ExecutionPolicy Bypass -c "irm https://usecornercase.dev/install.ps1 | iex"

      - name: build
        run: cargo build --locked

      - name: run
        shell: pwsh
        run: ./.github/smoke/windows.ps1

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: smoke-windows
          path: smoke-out

  guardrails:
    name: fmt + machete + jscpd + licences
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2,cargo-about@0.9.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: fmt
        run: cargo fmt --check

      - name: AGENTS.md within Codex's 32 KiB
        if: ${{ !cancelled() }}
        run: test "$(wc -c < AGENTS.md)" -le 32768

      - name: machete
        if: ${{ !cancelled() }}
        run: cargo-machete

      - name: jscpd
        if: ${{ !cancelled() }}
        run: npx -y jscpd@4.3.0

      - name: licences
        if: ${{ !cancelled() }}
        run: .github/release/release.sh notices "$RUNNER_TEMP/notices.txt"

      - name: version
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/release/release.sh pull-request "origin/$BASE_REF"
