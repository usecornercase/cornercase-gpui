name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: clippy + tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: tests
        run: cargo test --locked

  guardrails:
    name: fmt + machete + jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: fmt
        run: cargo fmt --check

      - name: AGENTS.md within Codex's 32 KiB
        if: ${{ !cancelled() }}
        run: test "$(wc -c < AGENTS.md)" -le 32768

      - name: machete
        if: ${{ !cancelled() }}
        run: cargo-machete

      - name: jscpd
        if: ${{ !cancelled() }}
        run: npx -y jscpd@4.3.0
